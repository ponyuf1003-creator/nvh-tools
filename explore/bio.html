<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>生物世界 · 探索博物馆</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg:#EEF3FB; --ink:#232B3D; --muted:#6B7690; --green:#3E9A62; --green-d:#2C7A4A;
        --blue:#3E6FE0; --gold:#D9A93A; --red:#E05555; --radius:22px; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg); color:var(--ink); min-height:100vh; user-select:none; }
.wrap { max-width:560px; margin:0 auto; padding:16px 16px 40px; }
.topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.back { text-decoration:none; color:var(--muted); font-weight:700; font-size:1.1rem;
        background:#fff; border-radius:999px; padding:10px 20px; box-shadow:0 3px 0 rgba(0,0,0,.06); }
.title { font-weight:900; font-size:1.15rem; }
.stars-chip { background:#fff; border-radius:999px; padding:8px 14px; font-weight:800;
              box-shadow:0 2px 0 rgba(0,0,0,.05); color:#E8A100; }
.stars-chip.pop { animation:chippop .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes chippop { 50% { transform:scale(1.35); } }
.card { background:#fff; border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:0 4px 0 rgba(0,0,0,.05); }
.btn { display:block; width:100%; border:none; cursor:pointer; border-radius:18px; padding:16px;
       font-size:1.15rem; font-weight:800; color:#fff; background:var(--green);
       box-shadow:0 5px 0 var(--green-d); transition:transform .06s; font-family:inherit; }
.btn:active { transform:translateY(4px); box-shadow:0 1px 0 var(--green-d); }
.btn.ghost { background:#E9F1EC; color:var(--green-d); box-shadow:0 5px 0 #CFE0D5; }
.btn.blue { background:var(--blue); box-shadow:0 5px 0 #2C52B3; }
.btn + .btn { margin-top:12px; }
.btn-hero { display:flex; align-items:center; gap:18px; background:linear-gradient(135deg,#3E9A62,#63C288);
            border-radius:var(--radius); padding:24px 22px; margin-bottom:14px; color:#fff;
            box-shadow:0 6px 0 var(--green-d); transition:transform .08s; cursor:pointer; text-decoration:none; display:flex; }
.btn-hero:active { transform:translateY(4px); box-shadow:0 2px 0 var(--green-d); }
.btn-hero .icon { font-size:3.2rem; line-height:1; }
.btn-hero .t { font-size:1.35rem; font-weight:900; }
.btn-hero .d { opacity:.95; font-size:.94rem; margin-top:5px; font-weight:600; }
.btn-hero.gold { background:linear-gradient(135deg,#D9A93A,#F0C563); box-shadow:0 6px 0 #B3862A; }
.emoji-big { text-align:center; font-size:5.6rem; line-height:1.1; margin-bottom:4px; }
.card-title { text-align:center; font-weight:900; font-size:1.35rem; margin-bottom:10px; }
.narr-box { font-size:1.12rem; line-height:1.85; color:var(--ink); background:#F5F8FC; border-radius:16px;
            padding:16px; cursor:pointer; }
.fact-box { margin-top:12px; background:#FFF7E3; border-radius:16px; padding:14px 16px; font-size:1.02rem;
            line-height:1.7; cursor:pointer; border:2px dashed #E9CE85; }
.fact-box b { color:var(--gold); }
.speaker { display:block; margin:14px auto 4px; border:none; cursor:pointer; width:78px; height:78px;
           border-radius:50%; background:var(--blue); color:#fff; font-size:2rem; box-shadow:0 5px 0 #2C52B3; }
.speaker:active { transform:translateY(3px); box-shadow:0 2px 0 #2C52B3; }
.dots { display:flex; gap:7px; justify-content:center; margin:0 0 10px; flex-wrap:wrap; }
.dot { width:11px; height:11px; border-radius:50%; background:#DCE3F0; }
.dot.on { background:var(--green); } .dot.now { background:var(--blue); transform:scale(1.3); }
.q-title { text-align:center; font-weight:800; font-size:1.2rem; margin-bottom:4px; }
.opt-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.opt { background:#fff; border:3px solid #E3E8F2; border-radius:18px; font-size:1.2rem; font-weight:800;
       padding:16px 8px; text-align:center; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.04); }
.opt .oe { font-size:1.7rem; display:block; margin-bottom:2px; }
.opt:active { transform:scale(.97); }
.opt.right { background:#E7F6EC; border-color:var(--green); animation:pop .35s; }
.opt.wrong { background:#FCEAEA; border-color:var(--red); animation:shake .4s; }
@keyframes pop { 50% { transform:scale(1.08); } }
@keyframes shake { 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
.pbar { height:12px; background:#E3E8F2; border-radius:999px; overflow:hidden; margin-bottom:14px; }
.pbar > i { display:block; height:100%; background:linear-gradient(90deg,#3E9A62,#63C288); border-radius:999px; transition:width .4s; }
.celebrate { text-align:center; padding:34px 10px; }
.celebrate .big { font-size:4.6rem; animation:bounce 1s infinite alternate; }
@keyframes bounce { to { transform:translateY(-12px); } }
.celebrate h2 { margin:12px 0 6px; } .celebrate p { color:var(--muted); margin-bottom:20px; }
.badge-wall { display:flex; gap:10px; justify-content:center; margin-top:10px; font-size:2.4rem; }
.badge-wall span.locked { filter:grayscale(1); opacity:.3; }
.topic-list { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.topic-row { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px; background:#F5F8FC; cursor:pointer; }
.topic-row .e { font-size:1.6rem; } .topic-row .t { flex:1; font-size:.95rem; font-weight:700; }
.topic-row .st { font-size:1.1rem; }
.coin-fly { position:fixed; width:48px; height:48px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFE566,#F5A623 55%,#B45309);
  box-shadow:0 0 0 3px #F5A623,0 6px 18px rgba(245,166,35,.6);
  display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:250;
  animation:coinfly .85s cubic-bezier(.4,0,.2,1) forwards; }
.coin-fly::after { content:'★'; font-size:22px; color:#92400E; font-weight:900; }
@keyframes coinfly { 0%{transform:translate(0,0) scale(1.3) rotate(-15deg);opacity:1}
  40%{transform:translate(calc(var(--tx)*.4),calc(var(--ty)*.3)) scale(1.6) rotate(25deg);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(.3) rotate(360deg);opacity:0} }
.muted { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">⬅️ 博物馆</a>
    <div class="title">🦁 生物世界</div>
    <div class="stars-chip">⭐ <span id="stars">0</span></div>
  </div>
  <div id="stage"></div>
</div>

<script>
const CARDS = [{"id": "c01", "emoji": "🐘", "title": "什么是哺乳动物？", "narr": "哺乳动物是用奶喂宝宝的动物，它们身上大多长着毛发，用肺来呼吸。猫、狗、大象，还有我们人类，都是哺乳动物哦！", "fact": "蓝鲸也是哺乳动物，它是世界上最大的动物，比恐龙还要大！"}, {"id": "c02", "emoji": "🦅", "title": "鸟儿为什么会飞？", "narr": "鸟类的身上长着轻飘飘的羽毛，前肢变成了翅膀，骨头里面是空心的，这样才能飞得又高又远。大部分鸟妈妈会生蛋，孵出小鸟。", "fact": "鸵鸟是世界上最大的鸟，但是它的翅膀太小了不会飞，只能用长腿飞快地跑！"}, {"id": "c03", "emoji": "🐟", "title": "鱼儿在水里怎么呼吸？", "narr": "鱼儿的头两侧长着鳃，水流过鳃的时候，鱼就能吸到水里的氧气，就像我们用鼻子呼吸空气一样。鱼身上还盖着一层滑滑的鳞片保护自己。", "fact": "海马其实是一种鱼，它们是唯一由爸爸来生宝宝的动物！"}, {"id": "c04", "emoji": "🐜", "title": "昆虫有几条腿？", "narr": "昆虫的身体分成头、胸、腹三部分，它们都有六条腿，大多数昆虫还长着一对或两对翅膀。蚂蚁、蝴蝶、蜜蜂，都是昆虫。", "fact": "蚂蚁虽然很小，但是能举起比自己重五十倍的东西！"}, {"id": "c05", "emoji": "🌱", "title": "种子是怎么长成大树的？", "narr": "一颗小小的种子被埋进泥土里，喝饱了水，晒到阳光，就会慢慢发芽，先长出小小的根，再长出嫩绿的芽，一点一点长成大树。", "fact": "世界上最大的种子是海椰子，一颗就有二十多公斤重，比一个小朋友还要重！"}, {"id": "c06", "emoji": "🌳", "title": "树叶为什么是绿色的？", "narr": "树叶里藏着一个绿色的小工厂，它能用阳光、空气和水，帮大树制造养分，这个过程还会放出我们呼吸需要的氧气，所以树叶大多是绿色的。", "fact": "地球上大部分的氧气，都是森林和海里的小植物制造出来的！"}, {"id": "c07", "emoji": "❤️", "title": "心脏在忙什么？", "narr": "心脏是身体里的小水泵，它一刻不停地跳动，把血液送到全身每一个地方，血液会带着营养和氧气，给身体各处送去能量。", "fact": "你的心脏一天大约要跳十万次，一辈子都不会停下来休息！"}, {"id": "c08", "emoji": "🦴", "title": "骨头有什么用？", "narr": "我们身体里有两百多块骨头，它们连在一起，撑起了我们的身体，让我们能站立、能走路，还能保护心脏和大脑这些重要的器官。", "fact": "你身体里最长的骨头在大腿里，最小的骨头却藏在耳朵里！"}, {"id": "c09", "emoji": "🦕", "title": "恐龙生活在什么时候？", "narr": "恐龙生活在很久很久以前，那时候还没有人类。它们在地球上生活了超过一亿六千万年，后来因为环境发生了巨大变化，恐龙就渐渐灭绝了。科学家是通过挖出的化石，才知道恐龙的样子。", "fact": "鸟类是恐龙的近亲，很多科学家认为，鸟类就是恐龙的后代！"}, {"id": "c10", "emoji": "🐼", "title": "为什么要保护大熊猫？", "narr": "大熊猫是我们中国特有的珍稀动物，因为森林减少、食物变少，野外的大熊猫曾经只剩下很少很少。经过大家一起努力保护，大熊猫的数量已经渐渐变多了。", "fact": "大熊猫每天要吃十几个小时的竹子，一天能吃掉将近二十公斤！"}];
const QUIZ = [{"id": "q01", "card": "c01", "q": "下面哪个是哺乳动物？", "opts": [["大象", "🐘", 1], ["金鱼", "🐟", 0], ["老鹰", "🦅", 0], ["蚂蚁", "🐜", 0]]}, {"id": "q02", "card": "c03", "q": "鱼儿用什么呼吸？", "opts": [["鼻子", "👃", 0], ["肺", "🫁", 0], ["鳃", "🐟", 1], ["嘴巴", "👄", 0]]}, {"id": "q03", "card": "c04", "q": "昆虫一般有几条腿？", "opts": [["4条", "", 0], ["6条", "", 1], ["8条", "", 0], ["2条", "", 0]]}, {"id": "q04", "card": "c05", "q": "种子发芽先长出什么？", "opts": [["叶子", "🍃", 0], ["花朵", "🌸", 0], ["根", "🌱", 1], ["果实", "🍎", 0]]}, {"id": "q05", "card": "c06", "q": "树叶为什么大多是绿色的？", "opts": [["好看", "", 0], ["制造养分", "🌿", 1], ["怕被吃掉", "", 0], ["反光", "", 0]]}, {"id": "q06", "card": "c07", "q": "心脏最重要的工作是什么？", "opts": [["呼吸空气", "", 0], ["运送血液", "❤️", 1], ["消化食物", "", 0], ["思考问题", "", 0]]}, {"id": "q07", "card": "c08", "q": "我们身体里大约有多少块骨头？", "opts": [["10块", "", 0], ["50块", "", 0], ["200多块", "🦴", 1], ["1000块", "", 0]]}, {"id": "q08", "card": "c09", "q": "恐龙是怎么灭绝的？", "opts": [["被人捕杀", "", 0], ["环境变化", "🌋", 1], ["生病了", "", 0], ["被打败", "", 0]]}, {"id": "q09", "card": "c09", "q": "科学家怎么知道恐龙的样子？", "opts": [["看照片", "", 0], ["挖化石", "🦴", 1], ["读日记", "", 0], ["靠猜测", "", 0]]}, {"id": "q10", "card": "c10", "q": "大熊猫数量为什么曾经变少？", "opts": [["森林减少", "🌲", 1], ["不爱运动", "", 0], ["太懒惰", "", 0], ["天气冷", "", 0]]}];
const CMAP = {}; CARDS.forEach(c => CMAP[c.id] = c);

/* ============ 存储 ============ */
const KEY = 'museum_bio_v1';
let S = null;
function load() { if (S) return S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  if (!S) S = {};
  S.read = S.read || {};           // cardId -> true
  S.stars = S.stars || 0;
  S.badge = S.badge || false;      // 生物小达人
  S.bestQuiz = S.bestQuiz || 0;
  return S; }
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

/* ============ 语音（预录音频） ============ */
let _audio = null;
function speak(id) {
  if (_audio) { try { _audio.pause(); } catch(e) {} _audio = null; }
  const a = new Audio('audio/' + encodeURIComponent(id) + '.m4a');
  _audio = a; a.play().catch(() => {});
}

/* ============ 特效 ============ */
function shuffle(a) { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function sfx(ok) { try { const ctx = sfx._c || (sfx._c = new (window.AudioContext||window.webkitAudioContext)());
  (ok ? [[523,0],[659,.12],[784,.24]] : [[300,0],[240,.16]]).forEach(([f,d]) => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination);
    o.type = ok ? 'sine' : 'sawtooth'; o.frequency.value = f; const t = ctx.currentTime + d;
    g.gain.setValueAtTime(ok ? .25 : .15, t); g.gain.exponentialRampToValueAtTime(.001, t+.25); o.start(t); o.stop(t+.3); });
  } catch(e) {} }
function coinBurst(anchor, n) { n = n||3; const dst = document.querySelector('.stars-chip'); if (!anchor || !dst) return;
  const s = anchor.getBoundingClientRect(), d = dst.getBoundingClientRect();
  for (let i = 0; i < n; i++) setTimeout(() => { sfx(true);
    const el = document.createElement('div'); el.className = 'coin-fly';
    const sx = s.left+s.width/2-24+(Math.random()*70-35), sy = s.top+s.height/2-24;
    el.style.left = sx+'px'; el.style.top = sy+'px';
    el.style.setProperty('--tx',(d.left+d.width/2-sx-24)+'px'); el.style.setProperty('--ty',(d.top+d.height/2-sy-24)+'px');
    document.body.appendChild(el);
    setTimeout(() => { el.remove(); dst.classList.remove('pop'); void dst.offsetWidth; dst.classList.add('pop'); }, 830);
  }, i*170); }
function confetti() { const cols = ['#3E9A62','#3E6FE0','#D9A93A','#E05555','#63C288'];
  for (let i = 0; i < 30; i++) { const d = document.createElement('div');
    d.style.cssText = `position:fixed;top:-12px;left:${Math.random()*100}vw;width:10px;height:10px;z-index:98;pointer-events:none;
      background:${cols[i%cols.length]};border-radius:${Math.random()>.5?'50%':'2px'};transition:transform ${1.6+Math.random()}s ease-in,opacity 2.2s;`;
    document.body.appendChild(d);
    requestAnimationFrame(() => { d.style.transform = `translateY(${100+Math.random()*15}vh) rotate(${Math.random()*720}deg)`; d.style.opacity = '0'; });
    setTimeout(() => d.remove(), 2600); } }

/* ============ 界面 ============ */
const stage = () => document.getElementById('stage');
let readIdx = 0, readQueue = [];

function home() {
  load();
  document.getElementById('stars').textContent = S.stars;
  const readCount = Object.keys(S.read).length;
  const allRead = readCount >= CARDS.length;

  let hero;
  if (S.badge) {
    hero = `<div class="btn-hero gold" onclick="startQuiz()">
      <div class="icon">🏆</div><div><div class="t">生物小达人</div><div class="d">再测一次，挑战满分！</div></div></div>`;
  } else if (allRead) {
    hero = `<div class="btn-hero gold" onclick="startQuiz()">
      <div class="icon">🎯</div><div><div class="t">去挑战测验</div><div class="d">全部读完啦，来赢一枚勋章吧！</div></div></div>`;
  } else {
    hero = `<div class="btn-hero" onclick="startReading()">
      <div class="icon">▶️</div><div><div class="t">${readCount ? '继续探索' : '开始探索'}</div><div class="d">已读 ${readCount} / ${CARDS.length} 个知识卡</div></div></div>`;
  }

  const rows = CARDS.map(c => `
    <div class="topic-row" onclick="openCard('${c.id}')">
      <span class="e">${c.emoji}</span><span class="t">${c.title}</span>
      <span class="st">${S.read[c.id] ? '✅' : '⬜'}</span>
    </div>`).join('');

  stage().innerHTML = `${hero}
    <div class="card">
      <div style="font-weight:800;margin-bottom:6px">📚 知识卡片（点击可单独复习）</div>
      <div class="topic-list">${rows}</div>
    </div>
    ${S.badge ? `<div class="card" style="text-align:center"><div style="font-weight:800;margin-bottom:8px">🎖️ 我的勋章</div><div class="badge-wall"><span title="生物小达人">🦁🏅</span></div></div>` : ''}`;
}

/* —— 阅读流程 —— */
function startReading() { readQueue = CARDS.filter(c => !load().read[c.id]); readIdx = 0; renderCard(); }
function openCard(id) { readQueue = [CMAP[id]]; readIdx = 0; renderCard(true); }

function dots() { return `<div class="dots">${readQueue.map((_, i) =>
  `<span class="dot${i < readIdx ? ' on' : i === readIdx ? ' now' : ''}"></span>`).join('')}</div>`; }

function renderCard(single) {
  if (readIdx >= readQueue.length) return single ? home() : readingDone();
  const c = readQueue[readIdx];
  stage().innerHTML = `
    ${!single ? dots() : ''}
    <div class="card">
      <div class="emoji-big">${c.emoji}</div>
      <div class="card-title">${c.title}</div>
      <button class="speaker" onclick="speak('${c.id}-narr')">🔊</button>
      <div class="narr-box" onclick="speak('${c.id}-narr')">${c.narr}</div>
      <div class="fact-box" onclick="speak('${c.id}-fact')"><b>💡 你知道吗？</b>${c.fact} 🔊</div>
    </div>
    <button class="btn" onclick="nextCard('${c.id}', ${!!single})">${single ? '回到列表' : (readIdx < readQueue.length - 1 ? '下一个知识 ➡️' : '读完啦，去下一步 ➡️')}</button>`;
  setTimeout(() => speak(c.id + '-narr'), 300);
}
function nextCard(id, single) {
  load(); S.read[id] = true; save();
  if (single) return home();
  readIdx++;
  renderCard();
}
function readingDone() {
  confetti();
  const readCount = Object.keys(load().read).length;
  const allRead = readCount >= CARDS.length;
  stage().innerHTML = `
    <div class="card celebrate">
      <div class="big">🌟</div><h2>今天的探索完成啦！</h2>
      <p>${allRead ? '十个知识卡都读完了，快去挑战测验吧！' : '明天再来读更多知识卡～'}</p>
      ${allRead ? `<button class="btn" onclick="startQuiz()">去挑战测验 🎯</button>` : ''}
      <button class="btn ghost" onclick="home()">回到博物馆</button>
    </div>`;
}

/* —— 测验流程 —— */
let quiz = [], qIdx = 0, qRight = 0, lock = false;
function startQuiz() { quiz = shuffle(QUIZ.slice()).slice(0, 6); qIdx = 0; qRight = 0; renderQ(); }
function renderQ() {
  lock = false;
  if (qIdx >= quiz.length) return quizDone();
  const q = quiz[qIdx];
  const opts = shuffle(q.opts.slice());
  stage().innerHTML = `
    <div class="pbar"><i style="width:${(qIdx/quiz.length*100)}%"></i></div>
    <div class="card">
      <div class="q-title">${q.q}</div>
      <button class="speaker" onclick="speak('${q.id}')">🔊</button>
      <div class="opt-grid">
        ${opts.map(([label, emoji, ok]) => `<div class="opt" onclick="pickQ(this,${ok},'${label}')">${emoji ? `<span class="oe">${emoji}</span>` : ''}${label}</div>`).join('')}
      </div>
    </div>`;
  setTimeout(() => speak(q.id), 300);
}
function pickQ(el, ok, label) {
  if (lock) return;
  lock = true;
  if (ok) { el.classList.add('right'); sfx(true); qRight++; speak(label); }
  else { el.classList.add('wrong'); sfx(false); }
  setTimeout(() => { qIdx++; renderQ(); }, ok ? 1100 : 1300);
}
function quizDone() {
  load();
  const pct = Math.round(qRight / quiz.length * 100);
  const passed = pct >= 80;
  let starMsg = '';
  if (passed) {
    if (!S.badge) { S.badge = true; S.stars += 2; starMsg = '获得「生物小达人」勋章 + 2颗星星！'; }
    else { S.stars += 1; starMsg = '得到一颗星星！'; }
  }
  S.bestQuiz = Math.max(S.bestQuiz, pct);
  save();
  document.getElementById('stars').textContent = S.stars;
  if (passed) { coinBurst(stage(), passed ? 3 : 1); confetti(); }
  stage().innerHTML = `
    <div class="card celebrate">
      <div class="big">${passed ? '🏆' : '💪'}</div>
      <h2>答对 ${qRight} / ${quiz.length} 题！${starMsg}</h2>
      <p>${passed ? '你是真正的生物小达人！' : '再读一读知识卡，下次一定能拿到勋章～'}</p>
      <button class="btn" onclick="startQuiz()">再测一次 🔁</button>
      <button class="btn ghost" onclick="home()">回到博物馆</button>
    </div>`;
}

home();
</script>
</body>
</html>
