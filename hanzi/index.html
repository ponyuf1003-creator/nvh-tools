<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小小识字岛</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title" style="font-size:1.4rem">🏝️ 小小识字岛</div>
    <div class="stars-chip">⭐ <span id="stars">0</span></div>
  </div>

  <div class="card" style="display:flex;align-items:center;gap:14px">
    <div style="font-size:2.6rem">🐼</div>
    <div>
      <div style="font-weight:800;font-size:1.1rem" id="greet">你好呀！</div>
      <div class="muted" id="streak-line">今天也一起来认字吧！</div>
    </div>
  </div>

  <a class="btn-hero" id="main-btn" href="learn.html?flow=1">
    <div class="icon" id="main-icon">▶️</div>
    <div><div class="t" id="main-title">开始今天的学习</div><div class="d" id="main-desc">…</div></div>
  </a>

  <a class="task-card" href="games.html">
    <div class="icon">🎮</div>
    <div><div class="t">游戏乐园</div><div class="d">摘果子 · 描红闯关</div></div>
    <div class="check" id="game-check"></div>
  </a>

  <div class="card">
    <div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px">
      <span>🚩 识字进度</span><span id="progress-text">0 / 1000</span>
    </div>
    <div class="pbar"><i id="progress-bar" style="width:0%"></i></div>
  </div>

  <div class="card">
    <div style="font-weight:700">🏡 我的动物小岛 <span class="muted" id="animal-hint"></span></div>
    <div class="animal-row" id="animal-row"></div>
  </div>

  <div style="text-align:center;margin-top:18px">
    <a href="../" style="color:#B9B29F;text-decoration:none;font-size:.9rem">🎪 学习乐园</a>
    &nbsp;·&nbsp;
    <a href="parent.html" style="color:#B9B29F;text-decoration:none;font-size:.9rem">⚙️ 家长中心</a>
  </div>
</div>

<script src="data/chars.js"></script>
<script src="js/core.js"></script>
<script>
(async function () {
  await AppData.load();
  const s = Store.load();
  document.getElementById('stars').textContent = s.stars;

  const hour = new Date().getHours();
  document.getElementById('greet').textContent =
    hour < 12 ? '早上好呀！' : hour < 18 ? '下午好呀！' : '晚上好呀！';
  const st = Store.streak();
  if (st > 1) document.getElementById('streak-line').textContent = `已经连续学习 ${st} 天啦，真棒！🔥`;

  const done = Store.todayDone();
  const due = SRS.dueList();
  const todayLog = Store.todayLog();
  const newLeft = Math.max(0, s.settings.newPerDay - todayLog.new.length);
  const newChars = SRS.newList(newLeft);

  // 一键主按钮：有复习先复习，再学新字，全完成则引向游戏
  const btn = document.getElementById('main-btn');
  const icon = document.getElementById('main-icon');
  const title = document.getElementById('main-title');
  const desc = document.getElementById('main-desc');
  const dueN = Math.min(due.length, s.settings.reviewCap);
  if (due.length) {
    btn.href = 'review.html?flow=1';
    desc.textContent = newChars.length
      ? `先复习 ${dueN} 个字，再学 ${newChars.length} 个新字`
      : `复习 ${dueN} 个字`;
  } else if (newChars.length) {
    btn.href = 'learn.html?flow=1';
    desc.textContent = `今天学 ${newChars.length} 个新字：${newChars.join('、')}`;
  } else if (newLeft === 0 || !SRS.newList(1).length) {
    btn.href = 'games.html';
    icon.textContent = '🎉';
    title.textContent = '今天都完成啦！';
    desc.textContent = '去游戏乐园玩一玩吧';
    btn.classList.add('done');
  }

  if (done.game) document.getElementById('game-check').textContent = '✅';

  // 进度
  const stats = SRS.stats();
  document.getElementById('progress-text').textContent = `${stats.met} / ${stats.total}`;
  document.getElementById('progress-bar').style.width = (stats.met / stats.total * 100).toFixed(1) + '%';

  // 动物岛
  const unlocked = unlockedAnimals();
  const row = document.getElementById('animal-row');
  ANIMALS.forEach(([emoji, name], i) => {
    const sp = document.createElement('span');
    sp.textContent = emoji;
    sp.title = name;
    if (i >= unlocked) sp.className = 'locked';
    else sp.onclick = () => toast(name + ' 陪你一起学习！');
    row.appendChild(sp);
  });
  const need = STAR_PER_ANIMAL - (s.stars % STAR_PER_ANIMAL);
  document.getElementById('animal-hint').textContent =
    unlocked >= ANIMALS.length ? '全部集齐啦！' : `再得 ${need} 颗星星，新朋友就来啦`;
})();
</script>
</body>
</html>
