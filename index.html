<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>学习乐园</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎪</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #FFF6E9; --card: #fff; --ink: #3D3B37; --muted: #8A8578;
  --radius: 24px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--ink); min-height: 100vh; user-select: none;
}
.wrap { max-width: 620px; margin: 0 auto; padding: 24px 18px 40px; }

.hero {
  background: linear-gradient(135deg, #FF9F43, #FFC069);
  border-radius: var(--radius); color: #fff;
  padding: 26px 24px; display: flex; align-items: center; gap: 18px;
  box-shadow: 0 8px 24px rgba(255, 159, 67, .35); margin-bottom: 24px;
}
.hero .mascot { font-size: 4rem; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
.hero h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: .04em; }
.hero p { margin-top: 6px; opacity: .92; font-size: .95rem; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 460px) { .grid { grid-template-columns: 1fr; } }
.mod {
  background: var(--card); border-radius: var(--radius);
  padding: 24px 20px; text-decoration: none; color: var(--ink);
  box-shadow: 0 5px 0 rgba(0,0,0,.06);
  position: relative; overflow: hidden; display: block;
  transition: transform .15s;
  border-top: 8px solid var(--accent);
}
.mod:active { transform: scale(.97); }
.mod { text-align: center; }
.mod .icon { font-size: 4.6rem; line-height: 1; }
.mod h2 { font-size: 1.4rem; font-weight: 900; margin: 14px 0 6px; }
.mod p { color: var(--muted); font-size: .9rem; line-height: 1.5; }
.mod.soon { cursor: pointer; }
.mod .badge {
  position: absolute; top: 16px; right: 16px;
  font-size: .75rem; font-weight: 800; padding: 5px 12px; border-radius: 999px;
}
.mod .badge.on { background: #E4F7E7; color: #2F8B3C; }
.mod .badge.soon { background: #F1EADB; color: #A79F8C; }
.mod.soon { opacity: .62; cursor: default; }
.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
  background: #3D3B37; color: #fff; padding: 12px 26px; border-radius: 999px;
  font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 99;
}
.toast.show { opacity: .92; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="mascot">🐻</div>
    <div>
      <h1>学习乐园</h1>
      <p id="greet">今天想学点什么呀？选一个开始吧 👇</p>
    </div>
  </div>

  <div class="grid">
    <a class="mod" href="english/" style="--accent:#7C3AED">
      <span class="badge on">开放中</span>
      <div class="icon">🦉</div>
      <h2>英语乐园</h2>
      <p>单词 · 拼读</p>
    </a>

    <a class="mod" href="hanzi/" style="--accent:#FF9F43">
      <span class="badge on">开放中</span>
      <div class="icon">🏝️</div>
      <h2>识字岛</h2>
      <p>认字 · 写字 · 游戏</p>
    </a>

    <div class="mod soon" style="--accent:#4D96FF" onclick="soon('拼音星球')">
      <span class="badge soon">敬请期待</span>
      <div class="icon">🚀</div>
      <h2>拼音星球</h2>
      <p>建设中</p>
    </div>

    <a class="mod" href="math/" style="--accent:#6BCB77">
      <span class="badge on">开放中</span>
      <div class="icon">🔢</div>
      <h2>数学王国</h2>
      <p>数一数 · 加减法</p>
    </a>
  </div>

</div>
<script>
const h = new Date().getHours();
document.getElementById('greet').textContent =
  (h < 12 ? '早上好！' : h < 18 ? '下午好！' : '晚上好！') + '今天想学点什么呀？👇';
let _t;
function soon(name) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = '🚧 ' + name + '还在建设中，很快就开放啦！';
  el.classList.add('show');
  clearTimeout(_t); _t = setTimeout(() => el.classList.remove('show'), 2000);
}
</script>
</body>
</html>
