<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>学习乐园</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎪</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #FFF6E9; --card: #fff; --ink: #3D3B37; --muted: #8A8578;
  --radius: 24px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--ink); min-height: 100vh; user-select: none;
}
.wrap { max-width: 620px; margin: 0 auto; padding: 24px 18px 40px; }

.hero {
  background: linear-gradient(135deg, #FF9F43, #FFC069);
  border-radius: var(--radius); color: #fff;
  padding: 26px 24px; display: flex; align-items: center; gap: 18px;
  box-shadow: 0 8px 24px rgba(255, 159, 67, .35); margin-bottom: 24px;
}
.hero .mascot { font-size: 4rem; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
.hero h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: .04em; }
.hero p { margin-top: 6px; opacity: .92; font-size: .95rem; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 460px) { .grid { grid-template-columns: 1fr; } }
.mod {
  background: var(--card); border-radius: var(--radius);
  padding: 24px 20px; text-decoration: none; color: var(--ink);
  box-shadow: 0 5px 0 rgba(0,0,0,.06);
  position: relative; overflow: hidden; display: block;
  transition: transform .15s;
  border-top: 8px solid var(--accent);
}
.mod:active { transform: scale(.97); }
.mod .icon { font-size: 3.2rem; line-height: 1; }
.mod h2 { font-size: 1.25rem; font-weight: 900; margin: 12px 0 6px; }
.mod p { color: var(--muted); font-size: .88rem; line-height: 1.55; }
.mod .badge {
  position: absolute; top: 16px; right: 16px;
  font-size: .75rem; font-weight: 800; padding: 5px 12px; border-radius: 999px;
}
.mod .badge.on { background: #E4F7E7; color: #2F8B3C; }
.mod .badge.soon { background: #F1EADB; color: #A79F8C; }
.mod.soon { opacity: .62; cursor: default; }

.footer { text-align: center; margin-top: 30px; font-size: .85rem; color: #C4BCA7; }
.footer a { color: #B9B29F; text-decoration: none; margin: 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="mascot">🐻</div>
    <div>
      <h1>学习乐园</h1>
      <p id="greet">今天想学点什么呀？选一个开始吧 👇</p>
    </div>
  </div>

  <div class="grid">
    <a class="mod" href="english/" style="--accent:#7C3AED">
      <span class="badge on">开放中</span>
      <div class="icon">🔤</div>
      <h2>英语乐园</h2>
      <p>亲子单词卡 · 自然拼读四本书 · 短元音练习</p>
    </a>

    <a class="mod" href="hanzi/" style="--accent:#FF9F43">
      <span class="badge on">开放中</span>
      <div class="icon">🏝️</div>
      <h2>汉字识字岛</h2>
      <p>每天学新字 · 智能复习 · 描红写字 · 收集小动物</p>
    </a>

    <a class="mod soon" href="pinyin/" style="--accent:#4D96FF">
      <span class="badge soon">敬请期待</span>
      <div class="icon">🚀</div>
      <h2>拼音星球</h2>
      <p>声母韵母 · 声调游戏 · 拼读小火车（建设中）</p>
    </a>

    <a class="mod soon" href="math/" style="--accent:#6BCB77">
      <span class="badge soon">敬请期待</span>
      <div class="icon">🔢</div>
      <h2>数学王国</h2>
      <p>数与量 · 加减法 · 图形空间（建设中）</p>
    </a>
  </div>

  <div class="footer">
    ⚙️ <a href="eps_analyzer.html">EPS Analyzer</a> · <a href="nvh_waterfall.html">NVH Waterfall</a>
  </div>
</div>
<script>
const h = new Date().getHours();
document.getElementById('greet').textContent =
  (h < 12 ? '早上好！' : h < 18 ? '下午好！' : '晚上好！') + '今天想学点什么呀？👇';
</script>
</body>
</html>
