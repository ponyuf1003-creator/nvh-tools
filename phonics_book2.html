<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>自然拼读乐园 Book 2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

:root{
  --bg:#FFF8F0;
  --card:#FFFFFF;
  --text:#1A1A2E;
  --muted:#6B7280;
  --purple:#7C3AED;
  --purple-l:#EDE9FE;
  --green:#16A34A;
  --green-l:#DCFCE7;
  --red:#DC2626;
  --red-l:#FEE2E2;
  --gold:#D97706;
  --gold-l:#FEF3C7;
  --radius:24px;
  --shadow:0 6px 24px rgba(0,0,0,.10);
  --shadow-lg:0 12px 40px rgba(0,0,0,.16);
}

body{
  font-family:'Segoe UI','PingFang SC','Helvetica Neue',sans-serif;
  background:var(--bg);
  min-height:100vh;
  color:var(--text);
  user-select:none;
  overflow-x:hidden;
}

/* ══ HEADER ══ */
.hdr{
  background:linear-gradient(135deg,#7C3AED 0%,#4F46E5 100%);
  padding:16px 20px 14px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 20px rgba(124,58,237,.4);
  position:sticky;top:0;z-index:50;
}
.hdr-title{color:#fff;}
.hdr-title h1{font-size:19px;font-weight:900;letter-spacing:.3px;}
.hdr-title p{font-size:12px;opacity:.75;margin-top:2px;}
.coin-counter{
  background:rgba(255,255,255,.18);border-radius:30px;
  padding:8px 16px;display:flex;align-items:center;gap:8px;
  font-size:16px;font-weight:900;color:#fff;
}
.coin-counter.pop{animation:cpop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes cpop{0%,100%{transform:scale(1)}50%{transform:scale(1.4);}}

/* ══ SCREENS ══ */
.screen{display:none;padding:18px 16px 28px;max-width:600px;margin:0 auto;}
.screen.active{display:block;}
.screen.enter{animation:slideUp .35s cubic-bezier(.34,1.2,.64,1);}
@keyframes slideUp{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}

/* ══ BACK ══ */
.back{
  background:none;border:none;cursor:pointer;
  font-size:16px;font-weight:800;color:var(--purple);
  padding:0;display:inline-flex;align-items:center;gap:5px;
  margin-bottom:18px;
}

/* ══ HOME ══ */
.mascot-row{
  background:linear-gradient(135deg,#7C3AED,#A855F7);
  border-radius:var(--radius);color:#fff;
  padding:20px 22px;display:flex;align-items:center;gap:16px;
  margin-bottom:20px;
  box-shadow:0 6px 24px rgba(124,58,237,.35);
}
.mascot{font-size:64px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.mascot-text h2{font-size:20px;font-weight:900;}
.mascot-text p{font-size:13px;opacity:.85;margin-top:5px;}

/* Unit cards – 1 column on narrow, 2 on wider */
.unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.unit-card{
  background:var(--card);border:none;border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px 16px 16px;
  cursor:pointer;text-align:left;
  transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
  min-height:130px;
}
.unit-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.unit-card:active{transform:scale(.97);}
.unit-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:var(--accent);border-radius:var(--radius) var(--radius) 0 0;
}
.uc-vowel{
  font-size:36px;font-weight:900;color:var(--accent);
  line-height:1;margin-bottom:6px;
}
.uc-label{font-size:11px;font-weight:800;color:var(--accent);
  text-transform:uppercase;letter-spacing:.6px;}
.uc-fam{font-size:14px;font-weight:700;color:var(--text);margin:4px 0;}
.uc-count{font-size:12px;color:var(--muted);}
.uc-bar{height:5px;background:#EEE;border-radius:3px;margin-top:10px;}
.uc-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .4s;}
.uc-stars{font-size:16px;margin-top:7px;min-height:22px;}

/* ══ MODE SELECT ══ */
.mode-title{font-size:24px;font-weight:900;margin-bottom:4px;}
.mode-sub{font-size:14px;color:var(--muted);margin-bottom:22px;}
.mode-list{display:flex;flex-direction:column;gap:14px;}
.mode-item{
  background:var(--card);border:3px solid #E5E7EB;
  border-radius:var(--radius);
  padding:22px 20px;cursor:pointer;
  display:flex;align-items:center;gap:18px;
  transition:border-color .15s,box-shadow .15s,transform .15s;
  min-height:88px;
}
.mode-item:hover{border-color:var(--purple);
  box-shadow:0 6px 20px rgba(124,58,237,.2);transform:translateY(-2px);}
.mode-item:active{transform:scale(.98);}
.mi-icon{font-size:52px;flex-shrink:0;}
.mi-info h3{font-size:19px;font-weight:900;}
.mi-info p{font-size:13px;color:var(--muted);margin-top:4px;}
.mi-badge{
  margin-left:auto;background:var(--gold-l);
  border-radius:20px;padding:5px 12px;
  font-size:13px;font-weight:800;color:var(--gold);white-space:nowrap;
}

/* ══ QUIZ COMMON HEADER ══ */
.quiz-hdr{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.quiz-hdr .back{margin:0;}
.qprog-wrap{flex:1;}
.qprog-lbl{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px;}
.qprog{height:10px;background:#E5E7EB;border-radius:5px;}
.qprog-fill{height:100%;border-radius:5px;
  background:linear-gradient(90deg,#7C3AED,#A855F7);transition:width .4s;}
.streak{
  background:#FEF3C7;border-radius:20px;
  padding:7px 14px;font-size:15px;font-weight:900;color:var(--gold);
  white-space:nowrap;
}
.streak.bump{animation:sbump .3s ease;}
@keyframes sbump{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* ══ LISTEN CARD ══ */
.listen-card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:28px 20px 22px;
  text-align:center;margin-bottom:20px;
}
.listen-hint{font-size:16px;font-weight:700;color:var(--muted);margin-bottom:18px;}
.speak-btn{
  background:linear-gradient(135deg,#7C3AED,#4F46E5);
  border:none;border-radius:50%;
  width:104px;height:104px;cursor:pointer;
  font-size:44px;color:#fff;
  box-shadow:0 8px 28px rgba(124,58,237,.5);
  transition:transform .15s;
  display:inline-flex;align-items:center;justify-content:center;
}
.speak-btn:hover{transform:scale(1.08);}
.speak-btn:active{transform:scale(.94);}
.speak-btn.playing{animation:ripple 1s ease-in-out infinite;}
@keyframes ripple{
  0%{box-shadow:0 0 0 0 rgba(124,58,237,.55),0 8px 28px rgba(124,58,237,.5);}
  70%{box-shadow:0 0 0 22px rgba(124,58,237,0),0 8px 28px rgba(124,58,237,.5);}
  100%{box-shadow:0 0 0 0 rgba(124,58,237,0),0 8px 28px rgba(124,58,237,.5);}
}
.reveal-label{
  margin-top:16px;min-height:28px;font-size:15px;color:var(--muted);
  transition:all .25s;
}
.reveal-label.big{font-size:28px;font-weight:900;color:var(--text);}

/* ══ CHOICE GRID ══ */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.choice{
  background:var(--card);border:3.5px solid #E5E7EB;
  border-radius:22px;padding:18px 10px;
  cursor:pointer;text-align:center;
  transition:all .18s;position:relative;overflow:hidden;
  min-height:130px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.choice:hover:not(.answered){
  border-color:var(--purple);
  box-shadow:0 6px 20px rgba(124,58,237,.22);
  transform:translateY(-3px) scale(1.02);
}
.choice:active:not(.answered){transform:scale(.96);}
.choice .ce{font-size:64px;line-height:1;display:block;}
.choice .cw{font-size:22px;font-weight:900;color:var(--text);}
.choice.correct{border-color:var(--green);background:var(--green-l);animation:cpop2 .4s ease;}
.choice.wrong  {border-color:var(--red);  background:var(--red-l);  animation:shake .35s ease;}
@keyframes cpop2{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.cbadge{position:absolute;top:8px;right:10px;font-size:24px;opacity:0;transition:opacity .2s;}
.choice.correct .cbadge,.choice.wrong .cbadge{opacity:1;}

/* ══ FEEDBACK CARD ══ */
.fb-card{
  position:fixed;bottom:0;left:50%;
  transform:translateX(-50%) translateY(110%);
  width:min(560px,97vw);
  border-radius:28px 28px 0 0;
  padding:22px 24px 32px;
  z-index:180;transition:transform .38s cubic-bezier(.34,1.15,.64,1);
  box-shadow:0 -8px 36px rgba(0,0,0,.18);
  text-align:center;
}
.fb-card.show{transform:translateX(-50%) translateY(0);}
.fb-card.fb-ok {background:var(--green-l);border-top:6px solid var(--green);}
.fb-card.fb-no {background:var(--red-l);  border-top:6px solid var(--red);}
.fb-status{font-size:17px;font-weight:900;margin-bottom:12px;}
.fb-ok .fb-status{color:var(--green);}
.fb-no .fb-status{color:var(--red);}
.fb-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px;}
.fb-emoji{font-size:60px;}
.fb-en{font-size:38px;font-weight:900;color:var(--text);}
.fb-zh{font-size:22px;color:var(--muted);font-weight:700;margin-top:4px;}
.fb-again{
  background:var(--purple);color:#fff;border:none;
  border-radius:30px;padding:13px 28px;
  font-size:16px;font-weight:800;cursor:pointer;
  margin-top:8px;transition:transform .15s;font-family:inherit;
}
.fb-again:hover{transform:scale(1.05);}

/* ══ RESULT ══ */
#screen-result{text-align:center;}
.res-mascot{font-size:96px;margin-top:16px;animation:bounce 1s ease infinite;}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.06)}}
.res-title{font-size:30px;font-weight:900;margin:14px 0 6px;}
.res-sub  {font-size:16px;color:var(--muted);}
.res-stats{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:24px;margin:22px 0;
  display:flex;justify-content:space-around;
}
.rs-stat h2{font-size:40px;font-weight:900;color:var(--purple);}
.rs-stat p {font-size:14px;color:var(--muted);margin-top:4px;}
.res-stars {font-size:48px;letter-spacing:8px;margin:6px 0 16px;}
.res-coins-box{
  background:var(--gold-l);border-radius:var(--radius);
  padding:14px 20px;font-size:18px;font-weight:900;color:var(--gold);margin-bottom:22px;
}
.res-btns{display:flex;gap:12px;}
.res-btns button{
  flex:1;padding:20px;border:none;border-radius:var(--radius);
  font-size:17px;font-weight:900;cursor:pointer;
  transition:transform .15s;font-family:inherit;
}
.res-btns button:hover{transform:translateY(-2px);}
.btn-again{background:var(--purple-l);color:var(--purple);}
.btn-home {background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;
  box-shadow:0 6px 20px rgba(124,58,237,.4);}

/* ══ SPELL-BUILD ══ */
.build-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:28px 16px 22px;text-align:center;margin-bottom:22px;
}
.build-card .emoji-btn{
  font-size:80px;display:block;background:none;border:none;cursor:pointer;
  transition:transform .15s;line-height:1;
}
.build-card .emoji-btn:hover{transform:scale(1.1);}
.build-hint-txt{font-size:16px;color:var(--muted);font-weight:700;margin-top:10px;}

/* Blank slots */
.blanks{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.slot{
  width:58px;height:68px;border-radius:14px;
  border:3px solid #CBD5E1;background:#F8FAFC;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:900;color:var(--text);
  transition:all .2s;position:relative;cursor:pointer;
}
.slot.filled  {border-color:var(--purple);background:var(--purple-l);color:var(--purple);}
.slot.correct {border-color:var(--green); background:var(--green-l); color:var(--green);
  animation:cpop2 .35s ease;}
.slot.bad     {border-color:var(--red);   background:var(--red-l);   animation:shake .3s ease;}
.slot .sdel{
  position:absolute;top:-8px;right:-8px;
  width:22px;height:22px;border-radius:50%;
  background:var(--red);color:#fff;font-size:13px;font-weight:900;
  display:none;align-items:center;justify-content:center;cursor:pointer;line-height:1;
}
.slot.filled .sdel{display:flex;}
.slot-text{pointer-events:none;}

/* Letter tiles */
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;}
.ltile{
  width:62px;height:62px;border-radius:16px;
  background:linear-gradient(145deg,#7C3AED,#4F46E5);
  color:#fff;font-size:28px;font-weight:900;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 14px rgba(124,58,237,.38),0 2px 0 #3730A3;
  transition:transform .15s,opacity .15s,box-shadow .15s;
  font-family:inherit;
  position:relative;top:0;
}
.ltile:hover {transform:translateY(-4px);box-shadow:0 9px 22px rgba(124,58,237,.5),0 2px 0 #3730A3;}
.ltile:active{transform:translateY(2px);box-shadow:0 2px 8px rgba(124,58,237,.3),0 0 0 #3730A3;}
.ltile.used  {opacity:.22;pointer-events:none;transform:none;box-shadow:none;}
.ltile.bad   {animation:shake .3s ease;
  background:linear-gradient(145deg,#DC2626,#B91C1C);
  box-shadow:0 5px 14px rgba(220,38,38,.4),0 2px 0 #991B1B;}

/* ══ GOLD COIN FX ══ */
.fcoin{
  position:fixed;width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFE566,#F5A623 55%,#B45309);
  box-shadow:0 0 0 3px #F5A623,0 6px 18px rgba(245,166,35,.7),
             inset 0 2px 4px rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;pointer-events:none;z-index:250;
  animation:cfly .9s cubic-bezier(.4,0,.2,1) forwards;
}
.fcoin::after{content:'★';font-size:22px;color:#92400E;font-weight:900;
  text-shadow:0 1px 0 rgba(255,255,255,.35);}
@keyframes cfly{
  0%  {transform:translate(0,0) scale(1.4) rotate(-15deg);opacity:1;}
  40% {transform:translate(calc(var(--tx)*.4),calc(var(--ty)*.35)) scale(1.7) rotate(20deg);opacity:1;}
  100%{transform:translate(var(--tx),var(--ty)) scale(.25) rotate(360deg);opacity:0;}
}

/* ══ CONFETTI ══ */
.cp{position:fixed;pointer-events:none;z-index:300;animation:cfall linear forwards;}
@keyframes cfall{0%{transform:translateY(-20px) rotate(0);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ══ TOAST ══ */
.toast{
  position:fixed;bottom:36px;left:50%;
  transform:translateX(-50%) translateY(120px);
  background:#1A1A2E;color:#fff;padding:16px 32px;
  border-radius:40px;font-size:18px;font-weight:800;
  transition:transform .32s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;z-index:210;white-space:nowrap;
  box-shadow:0 8px 32px rgba(0,0,0,.25);
}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<div class="hdr">
  <div class="hdr-title">
    <h1>📖 自然拼读乐园 2</h1>
    <p><a href="index.html" style="color:#fff;opacity:.8;text-decoration:underline;">← 入门单词卡</a> · Short Vowels 短元音</p>
  </div>
  <div class="coin-counter" id="coin-counter">🪙 <span id="total-coins">0</span></div>
</div>

<!-- ══ HOME ══ -->
<div id="screen-home" class="screen active">
  <div class="mascot-row">
    <div class="mascot">🦉</div>
    <div class="mascot-text">
      <h2 id="greeting">你好！准备好了吗？</h2>
      <p>选一个单元开始练习吧 👇</p>
    </div>
  </div>
  <div class="unit-grid" id="unit-grid"></div>
</div>

<!-- ══ MODE SELECT ══ -->
<div id="screen-mode" class="screen">
  <button class="back" onclick="go('home')">← 返回</button>
  <div class="mode-title" id="mode-title">Unit 1</div>
  <div class="mode-sub"   id="mode-sub">选择练习方式</div>
  <div class="mode-list">
    <div class="mode-item" onclick="startQuiz('listen')">
      <div class="mi-icon">🔊</div>
      <div class="mi-info"><h3>听音选图</h3><p>听发音，点对应的图片</p></div>
      <div class="mi-badge">⭐</div>
    </div>
    <div class="mode-item" onclick="startQuiz('spell')">
      <div class="mi-icon">🖼️</div>
      <div class="mi-info"><h3>看图选词</h3><p>看图片，选出正确的单词</p></div>
      <div class="mi-badge">⭐⭐</div>
    </div>
    <div class="mode-item" onclick="startBuild()">
      <div class="mi-icon">✍️</div>
      <div class="mi-info"><h3>拼写单词</h3><p>听发音，选字母一个个拼出来</p></div>
      <div class="mi-badge">⭐⭐⭐</div>
    </div>
  </div>
</div>

<!-- ══ QUIZ ══ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-hdr">
    <button class="back" onclick="go('mode')">← 退出</button>
    <div class="qprog-wrap">
      <div class="qprog-lbl" id="qlbl">第 1 题 / 共 8 题</div>
      <div class="qprog"><div class="qprog-fill" id="qfill" style="width:0%"></div></div>
    </div>
    <div class="streak" id="streak">🔥 0</div>
  </div>

  <div class="listen-card">
    <div class="listen-hint" id="lhint">点击喇叭听单词 👂</div>
    <button class="speak-btn" id="speak-btn" onclick="handleSpeak()">🔊</button>
    <div class="reveal-label" id="reveal-lbl"></div>
  </div>

  <div class="choices" id="choices"></div>
</div>

<!-- ══ SPELL BUILD ══ -->
<div id="screen-build" class="screen">
  <div class="quiz-hdr">
    <button class="back" onclick="go('mode')">← 退出</button>
    <div class="qprog-wrap">
      <div class="qprog-lbl" id="blbl">第 1 题 / 共 8 题</div>
      <div class="qprog"><div class="qprog-fill" id="bfill" style="width:0%"></div></div>
    </div>
    <div class="streak" id="bscore">🪙 0</div>
  </div>

  <div class="build-card">
    <button class="emoji-btn" id="b-emoji" onclick="bSpeak()">🐱</button>
    <div class="build-hint-txt" id="b-hint">点图片听发音，再选字母拼出来 👇</div>
  </div>

  <div class="blanks" id="blanks"></div>
  <div class="pool"   id="pool"></div>
</div>

<!-- ══ RESULT ══ -->
<div id="screen-result" class="screen">
  <div class="res-mascot" id="r-mascot">🎉</div>
  <div class="res-title"  id="r-title">太棒了！</div>
  <div class="res-sub"    id="r-sub"></div>
  <div class="res-stats">
    <div class="rs-stat"><h2 id="r-ok">0</h2><p>答对 ✅</p></div>
    <div class="rs-stat"><h2 id="r-n">0</h2><p>共计 📝</p></div>
    <div class="rs-stat"><h2 id="r-pct">0%</h2><p>正确率 🎯</p></div>
  </div>
  <div class="res-stars"     id="r-stars">⭐⭐⭐</div>
  <div class="res-coins-box" id="r-coins"></div>
  <div class="res-btns">
    <button class="btn-again" onclick="retry()">🔄 再来一次</button>
    <button class="btn-home"  onclick="go('home')">🏠 回首页</button>
  </div>
</div>

<!-- ══ FEEDBACK CARD ══ -->
<div class="fb-card" id="fb-card">
  <div class="fb-status" id="fb-status"></div>
  <div class="fb-row">
    <span class="fb-emoji" id="fb-emoji"></span>
    <div><div class="fb-en" id="fb-en"></div><div class="fb-zh" id="fb-zh"></div></div>
  </div>
  <button class="fb-again" onclick="fbSpeak()">🔊 再听一次</button>
</div>

<div class="toast" id="toast"></div>

<script>

//  语音 — 优选清晰女声
// ════════════════════════════════
let _voiceCache = { en: null, zh: null, ready: false };

// 常见系统/浏览器里音质较好的女声名单（按优先级）
const FEMALE_EN_HINTS = ['Samantha','Google US English','Microsoft Zira','Ava','Susan','Karen','Moira','Tessa','Victoria','Allison','Female'];
const FEMALE_ZH_HINTS = ['Ting-Ting','Tingting','Google 普通话','Microsoft Yaoyao','Microsoft Xiaoxiao','Mei-Jia','Female'];

function pickVoice(lang, hints){
  const voices = speechSynthesis.getVoices();
  if(!voices.length) return null;
  const langVoices = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith(lang));
  if(!langVoices.length) return null;
  for(const hint of hints){
    const hit = langVoices.find(v=>v.name.includes(hint));
    if(hit) return hit;
  }
  // 找不到已知女声名单，退而求其次：排除明显男声关键词
  const maleHints = ['David','Male','Daniel','Fred','Alex','Yunyang','Yunjian'];
  const nonMale = langVoices.find(v=>!maleHints.some(m=>v.name.includes(m)));
  return nonMale || langVoices[0];
}

function refreshVoiceCache(){
  _voiceCache.en = pickVoice('en', FEMALE_EN_HINTS);
  _voiceCache.zh = pickVoice('zh', FEMALE_ZH_HINTS);
  _voiceCache.ready = true;
}
if('speechSynthesis' in window){
  refreshVoiceCache();
  speechSynthesis.onvoiceschanged = refreshVoiceCache;
}

function speak(text,lang,cb){
  if(typeof lang==='function'){cb=lang;lang='en-US';}
  lang=lang||'en-US';
  if(!('speechSynthesis' in window)){ if(cb)cb(); return; }
  speechSynthesis.cancel();
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang;
    u.rate=lang==='zh-CN'?0.68:0.62;   // 英文/中文都放慢，方便孩子跟读
    u.pitch=1.08;u.volume=1;
    const voice = lang==='zh-CN' ? _voiceCache.zh : _voiceCache.en;
    if(voice) u.voice = voice;
    u.onend=()=>{if(cb)cb();};
    u.onerror=()=>{if(cb)cb();};
    speechSynthesis.speak(u);
  },80);
}
function speakBi(word,hint,cb){
  speak(word,'en-US',()=>setTimeout(()=>speak(hint,'zh-CN',cb),420));
}

//  音效
// ════════════════════════════════
let AC=null;
function ac(){return AC||(AC=new(window.AudioContext||window.webkitAudioContext)());}
function tone(f,d,t='sine',v=.28){
  try{
    const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);
    o.start();o.stop(ctx.currentTime+d);
  }catch(e){}
}
const sfxOk  =()=>{tone(523,.12);setTimeout(()=>tone(659,.12),120);setTimeout(()=>tone(784,.25),240);};
const sfxBad =()=>{tone(300,.15,'sawtooth',.18);setTimeout(()=>tone(240,.2,'sawtooth',.18),160);};
const sfxCoin=()=>{tone(880,.08);setTimeout(()=>tone(1100,.15),90);};
const sfxWin =()=>{[523,587,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*100));};

function stars(p){return p>=95?'⭐⭐⭐':p>=70?'⭐⭐':p>=40?'⭐':'';}

function renderGrid(){
  const g=document.getElementById('unit-grid');
  g.innerHTML='';
  UNITS.forEach(u=>{
    const p=S.units[u.id]||{best:0,plays:0};
    const pct=Math.round(p.best);
    const btn=document.createElement('button');
    btn.className='unit-card';
    btn.style.setProperty('--accent',u.color);
    btn.innerHTML=`
      <div class="uc-vowel">${u.vowel.replace('Short ','')}</div>
      <div class="uc-label">${u.title}</div>
      <div class="uc-fam">${u.families}</div>
      <div class="uc-count">${u.words.length} 个单词</div>
      <div class="uc-bar"><div class="uc-fill" style="width:${pct}%"></div></div>
      <div class="uc-stars">${stars(pct)||(p.plays?'继续 💪':'点击开始 👆')}</div>`;
    btn.onclick=()=>openUnit(u.id);
    g.appendChild(btn);
  });
}

function openUnit(id){
  CU=UNITS.find(u=>u.id===id);
  document.getElementById('mode-title').textContent=CU.title+' · '+CU.vowel;
  document.getElementById('mode-sub').textContent='音素族：'+CU.families+' · '+CU.words.length+' 个单词';
  go('mode');
}

function startQuiz(mode){
  qMode=mode;qWords=shuffle([...CU.words]).slice(0,8);
  qIdx=0;qScore=0;qStreak=0;qAnswered=false;qCoins=0;
  updateStreak();

function renderQ(){
  qAnswered=false;
  const total=qWords.length;
  const cur=qWords[qIdx];
  document.getElementById('qlbl').textContent=`第 ${qIdx+1} 题 / 共 ${total} 题`;
  document.getElementById('qfill').style.width=(qIdx/total*100)+'%';

  const pool=UNITS.flatMap(u=>u.words).filter(w=>w.word!==cur.word);
  const choices=shuffle([cur,...shuffle(pool).slice(0,3)]);

  const sbtn=document.getElementById('speak-btn');
  const rlbl=document.getElementById('reveal-lbl');
  rlbl.textContent='';rlbl.className='reveal-label';

  if(qMode==='listen'){
    sbtn.textContent='🔊';sbtn.style.fontSize='44px';
    document.getElementById('lhint').textContent='点击喇叭听单词，再选对应的图片 👂';
    renderChoices(choices,cur,c=>`<span class="ce">${c.emoji}</span><span class="cw">${c.word}</span>`);
    setTimeout(()=>speakCur(),350);
  } else {
    sbtn.textContent=cur.emoji;sbtn.style.fontSize='56px';
    document.getElementById('lhint').textContent=`这是什么？（${cur.hint}）`;
    renderChoices(choices,cur,c=>`<span class="cw" style="font-size:28px">${c.word}</span>`);
    setTimeout(()=>speakCur(),350);
  }
}

function renderChoices(choices,correct,inner){
  const g=document.getElementById('choices');
  g.innerHTML='';
  choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='choice';
    btn.innerHTML=inner(c)+`<span class="cbadge"></span>`;
    btn.onclick=()=>pick(btn,c,correct);
    g.appendChild(btn);
  });
}

function speakCur(){
  if(qIdx>=qWords.length)return;
  const sb=document.getElementById('speak-btn');
  if(qMode==='listen'){sb.classList.add('playing');}
  speak(qWords[qIdx].word,'en-US',()=>sb.classList.remove('playing'));
}

function handleSpeak(){speakCur();}

function pick(btn,chosen,correct){
  if(qAnswered)return;
  qAnswered=true;
  const ok=chosen.word===correct.word;

  document.querySelectorAll('.choice').forEach(b=>b.classList.add('answered'));
  btn.classList.add(ok?'correct':'wrong');
  btn.querySelector('.cbadge').textContent=ok?'✅':'❌';

  if(!ok){
    document.querySelectorAll('.choice').forEach(b=>{
      const w=b.querySelector('.cw');
      if(w&&w.textContent===correct.word){b.classList.add('correct');b.querySelector('.cbadge').textContent='✅';}
    });
  }

  document.getElementById('reveal-lbl').textContent='';
  document.getElementById('reveal-lbl').className='reveal-label';

  if(ok){
    qScore++;qStreak++;
    sfxOk();updateStreak();
    const coins=qStreak>=3?3:qStreak>=2?2:1;
    qCoins+=coins;
    speakBi(correct.word,correct.hint,()=>awardCoins(coins,btn));
    if(qScore>=3)confetti(20);
  } else {
    qStreak=0;sfxBad();updateStreak();
    speak(chosen.word,'en-US',()=>setTimeout(()=>speakBi(correct.word,correct.hint),500));
  }

  setTimeout(()=>showFb(ok,chosen,correct),200);

  setTimeout(()=>{
    hideFb();
    setTimeout(()=>{
      qIdx++;
      if(qIdx<qWords.length){
        if(qMode==='listen'){document.getElementById('speak-btn').textContent='🔊';document.getElementById('speak-btn').style.fontSize='44px';}
        renderQ();
      } else showResult();
    },380);
  },3400);
}

function updateStreak(){
  const el=document.getElementById('streak');
  el.textContent=qStreak>=3?`🔥 ${qStreak} 连击！`:`🔥 ${qStreak}`;
  el.classList.remove('bump');void el.offsetWidth;
  if(qStreak>0)el.classList.add('bump');
}

function showResult(){
  const total=qWords.length;
  const pct=Math.round(qScore/total*100);
  const prev=S.units[CU.id]||{best:0,plays:0};
  S.units[CU.id]={best:Math.max(prev.best,pct),plays:prev.plays+1};

  if(pct===100){mascot='🏆';title='满分！完美！';sub='你是超级小天才！';sfxWin();confetti(70);}
  else if(pct>=88){mascot='🌟';title='非常棒！';sub='再来一次就能拿满分了！';}
  else if(pct>=62){mascot='😊';title='做得很好！';sub='继续练习，你越来越厉害了！';}
  else{mascot='💪';title='加油加油！';sub='多听几次，一定能学会的！';}

  document.getElementById('r-mascot').textContent=mascot;
  document.getElementById('r-title').textContent=title;
  document.getElementById('r-sub').textContent=sub;
  document.getElementById('r-ok').textContent=qScore;
  document.getElementById('r-n').textContent=total;
  document.getElementById('r-pct').textContent=pct+'%';
  document.getElementById('r-stars').textContent=stars(pct)||'💫';
  document.getElementById('r-coins').textContent=`🪙 本次获得 ${qCoins} 枚金币！累计 ${S.coins} 枚`;
  go('result');
}

function startBuild(){
  bWords=shuffle([...CU.words]).slice(0,8);
  bIdx=0;bCoins=0;
  document.getElementById('bscore').textContent='🪙 0';
  go('build');
  renderBQ();
}

function renderBQ(){
  bWord=bWords[bIdx];bFilled=[];bWrong=0;
  const total=bWords.length;
  document.getElementById('blbl').textContent=`第 ${bIdx+1} 题 / 共 ${total} 题`;
  document.getElementById('bfill').style.width=(bIdx/total*100)+'%';
  document.getElementById('b-emoji').textContent=bWord.emoji;
  document.getElementById('b-hint').textContent='点图片听发音，选字母一个个拼出来 👇';
  renderBlanks();
  renderPool();
  setTimeout(()=>bSpeak(),400);
}

function bSpeak(){speakBi(bWord.word,bWord.hint);}

function renderBlanks(){
  const c=document.getElementById('blanks');
  c.innerHTML='';
  bWord.word.split('').forEach((_,i)=>{
    const s=document.createElement('div');
    s.className='slot';s.id='sl'+i;s.dataset.i=i;
    s.addEventListener('click',()=>delSlot(i));
    const t=document.createElement('span');t.className='slot-text';s.appendChild(t);
    const d=document.createElement('span');d.className='sdel';d.textContent='×';s.appendChild(d);
    c.appendChild(s);
  });
}

function updateBlanks(){
  bWord.word.split('').forEach((_,i)=>{
    const s=document.getElementById('sl'+i);if(!s)return;
    const t=s.querySelector('.slot-text');
    if(i<bFilled.length){s.classList.add('filled');t.textContent=bFilled[i];}
    else{s.classList.remove('filled','correct','bad');t.textContent='';}
  });
}

function delSlot(idx){
  if(idx>=bFilled.length)return;
  document.querySelectorAll('#pool .ltile').forEach(t=>{
    const si=parseInt(t.dataset.slot);
    if(!isNaN(si)&&si>=idx){t.classList.remove('used');t.dataset.slot='';}
  });
  bFilled.splice(idx);
  updateBlanks();
}

function renderPool(){
  const c=document.getElementById('pool');c.innerHTML='';
  const letters=bWord.word.split('');
  const extras=shuffle(EXTRA.split('').filter(ch=>!bWord.word.includes(ch))).slice(0,Math.max(0,8-letters.length));
  shuffle([...letters,...extras]).forEach((ch,i)=>{
    const t=document.createElement('button');
    t.className='ltile';t.textContent=ch;
    t.dataset.letter=ch;t.dataset.tileIdx=i;t.dataset.slot='';
    t.addEventListener('click',()=>tapLetter(t,ch));
    c.appendChild(t);
  });
}

function tapLetter(tile,letter){
  if(tile.classList.contains('used'))return;
  const ni=bFilled.length;
  if(ni>=bWord.word.length)return;
  const exp=bWord.word[ni];

  if(letter===exp){
    tile.classList.add('used');tile.dataset.slot=String(ni);
    bFilled.push(letter);
    updateBlanks();
    const s=document.getElementById('sl'+ni);s.classList.add('correct');
    sfxOk();
    if(bFilled.length===bWord.word.length)setTimeout(wordDone,500);
  } else {
    bWrong++;
    tile.classList.add('bad');sfxBad();speak(letter,'en-US');
    setTimeout(()=>tile.classList.remove('bad'),500);
    const s=document.getElementById('sl'+ni);s.classList.add('bad');
    setTimeout(()=>s.classList.remove('bad'),400);
  }
}

function wordDone(){
  speakBi(bWord.word,bWord.hint);
  sfxWin();confetti(bWrong===0?38:18);
  const earned=bWrong===0?3:bWrong<=2?2:1;
  bCoins+=earned;
  document.getElementById('bscore').textContent='🪙 '+bCoins;
  awardCoins(earned,document.getElementById('b-emoji'));
  document.getElementById('b-hint').textContent=`🎉 "${bWord.word}" · ${bWord.hint}`;
  setTimeout(()=>{
    bIdx++;
    if(bIdx<bWords.length)renderBQ();
    else buildResult();
  },3400);
}

function buildResult(){
  const total=bWords.length;
  const prev=S.units[CU.id]||{best:0,plays:0};
  S.units[CU.id]={best:Math.max(prev.best,100),plays:prev.plays+1};
  save();updateCoins();
  document.getElementById('r-mascot').textContent='🏆';
  document.getElementById('r-title').textContent='全部拼完啦！';
  document.getElementById('r-sub').textContent='你把每个单词都拼出来了，超厉害！';
  document.getElementById('r-ok').textContent=total;
  document.getElementById('r-n').textContent=total;
  document.getElementById('r-pct').textContent='100%';
  document.getElementById('r-stars').textContent='⭐⭐⭐';
  document.getElementById('r-coins').textContent=`🪙 本次获得 ${bCoins} 枚金币！累计 ${S.coins} 枚`;
  sfxWin();confetti(70);go('result');
}

// ════════════════════════════════
//  金币特效
// ════════════════════════════════
function awardCoins(n,anchor){
  const src=anchor.getBoundingClientRect();
  const dst=document.getElementById('coin-counter').getBoundingClientRect();
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      sfxCoin();
      const el=document.createElement('div');
      el.className='fcoin';
      const sx=src.left+src.width/2-26,sy=src.top+src.height/2-26;
      el.style.left=sx+'px';el.style.top=sy+'px';
      el.style.setProperty('--tx',(dst.left+dst.width/2-sx-26)+'px');
      el.style.setProperty('--ty',(dst.top+dst.height/2-sy-26)+'px');
      document.body.appendChild(el);
      setTimeout(()=>{
        S.coins=(S.coins||0)+1;save();updateCoins();
        const cc=document.getElementById('coin-counter');
        cc.classList.remove('pop');void cc.offsetWidth;cc.classList.add('pop');
        el.remove();
      },870);
    },i*190);
  }
}

// ════════════════════════════════
//  工具函数
// ════════════════════════════════
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
const PRAISE=['太棒了！🎉','答对啦！⭐','真厉害！🌟','Perfect! ✨','Amazing! 🚀','Good job! 👏','哇，好厉害！🎊'];
function praise(){return PRAISE[Math.floor(Math.random()*PRAISE.length)];}

let tTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('show'),1700);
}

function confetti(n=30){
  const cols=['#EF4444','#10B981','#F59E0B','#7C3AED','#3B82F6','#EC4899','#22C55E'];
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const el=document.createElement('div');el.className='cp';
      el.style.cssText=`left:${Math.random()*100}vw;top:-20px;
        width:${8+Math.random()*9}px;height:${8+Math.random()*9}px;
        background:${cols[Math.floor(Math.random()*cols.length)]};
        border-radius:${Math.random()>.5?'50%':'4px'};
        animation-duration:${1.4+Math.random()*1.5}s;
        animation-delay:${Math.random()*.4}s;`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),3200);
    },i*38);
  }
}

boot();
</script>
