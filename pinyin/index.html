<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>拼音星球</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg:#F3F0FF; --ink:#2B2A44; --muted:#7A7896; --pur:#7B61FF; --pur-d:#5A43D6; --blue:#4D96FF; --blue-d:#2F73DD;
        --green:#3FB27F; --green-d:#2A8A5F; --red:#FF6B6B; --gold:#F5A623; --radius:22px;
        --py:"Avenir Next","Avenir","Segoe UI","Roboto","Helvetica Neue",Arial,sans-serif; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg); color:var(--ink); min-height:100vh; user-select:none; -webkit-user-select:none; }
.wrap { max-width:580px; margin:0 auto; padding:16px 16px 48px; }
.topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px; }
.back { text-decoration:none; color:var(--muted); font-weight:700; font-size:1.1rem; background:#fff; border:none;
        border-radius:999px; padding:10px 20px; box-shadow:0 3px 0 rgba(0,0,0,.07); cursor:pointer; font-family:inherit; }
.title { font-weight:900; font-size:1.15rem; }
.stars-chip { background:#fff; border-radius:999px; padding:8px 14px; font-weight:800; box-shadow:0 2px 0 rgba(0,0,0,.06); color:#E8A100; }
.stars-chip.pop { animation:chippop .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes chippop { 50% { transform:scale(1.35); } }
.card { background:#fff; border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:0 4px 0 rgba(0,0,0,.05); }
.btn { display:block; width:100%; border:none; cursor:pointer; border-radius:18px; padding:16px; font-size:1.15rem;
       font-weight:800; color:#fff; background:var(--pur); box-shadow:0 5px 0 var(--pur-d); font-family:inherit; }
.btn:active { transform:translateY(4px); box-shadow:0 1px 0 var(--pur-d); }
.btn.green { background:var(--green); box-shadow:0 5px 0 var(--green-d); }
.btn.ghost { background:#ECE8FF; color:var(--pur-d); box-shadow:0 5px 0 #D6CEFF; }
.btn + .btn { margin-top:12px; }
.btn-hero { display:flex; align-items:center; gap:18px; background:linear-gradient(135deg,#7B61FF,#A48BFF); border-radius:var(--radius);
            padding:22px; margin-bottom:14px; color:#fff; box-shadow:0 6px 0 var(--pur-d); cursor:pointer; }
.btn-hero:active { transform:translateY(4px); box-shadow:0 2px 0 var(--pur-d); }
.btn-hero.done { background:linear-gradient(135deg,#3FB27F,#79D9A8); box-shadow:0 6px 0 var(--green-d); }
.btn-hero .icon { font-size:3.1rem; line-height:1; } .btn-hero .t { font-size:1.35rem; font-weight:900; }
.btn-hero .d { opacity:.96; font-size:.95rem; margin-top:5px; font-weight:600; }
.game-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
.game { background:#fff; border-radius:20px; padding:16px 12px; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,.05); cursor:pointer; }
.game .gi { font-size:2.4rem; } .game .gt { font-weight:800; margin-top:4px; } .game .gd { color:var(--muted); font-size:.8rem; margin-top:2px; }
.game.locked { opacity:.45; }
/* 闯关地图 */
.stage-h { display:flex; align-items:center; gap:8px; font-weight:900; margin:14px 0 8px; }
.stage-h .pill { color:#fff; border-radius:999px; padding:3px 12px; font-size:.85rem; }
.bubbles { display:flex; flex-wrap:wrap; gap:10px; }
.bub { min-width:62px; height:62px; padding:0 10px; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center;
       background:#fff; font-weight:800; font-family:var(--py); font-size:1.02rem; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.06);
       border:3px solid transparent; position:relative; }
.bub small { font-size:.62rem; font-family:-apple-system,"PingFang SC",sans-serif; color:var(--muted); font-weight:700; }
.bub.done { color:#fff; } .bub.done small { color:rgba(255,255,255,.85); }
.bub.now { border-color:var(--gold); animation:glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow:0 0 0 6px rgba(245,166,35,.25); } }
.bub.lock { opacity:.4; }
/* 四线三格 */
.g4 { display:block; margin:6px auto; max-width:100%; }
.g4 line { stroke:#F0A3A3; stroke-width:1.4; } .g4 line.base { stroke:#E06C6C; stroke-width:1.8; }
.g4 text { font-family:var(--py); fill:var(--ink); font-weight:600; }
.emoji-big { text-align:center; font-size:4.4rem; line-height:1.1; }
.rhyme { text-align:center; font-size:1.12rem; line-height:1.7; background:#F6F4FF; border-radius:14px; padding:10px 14px; margin-top:8px; cursor:pointer; }
.speaker { display:block; margin:10px auto 4px; border:none; cursor:pointer; width:76px; height:76px; border-radius:50%;
           background:var(--blue); color:#fff; font-size:2rem; box-shadow:0 5px 0 var(--blue-d); }
.speaker:active { transform:translateY(3px); box-shadow:0 2px 0 var(--blue-d); }
.tone-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
.tone-btn { background:#FFF5E6; border:2px solid #FFD79A; border-radius:16px; padding:10px 2px; text-align:center; cursor:pointer;
            font-family:var(--py); font-size:1.7rem; font-weight:600; }
.tone-btn small { display:block; font-family:-apple-system,"PingFang SC",sans-serif; font-size:.7rem; color:var(--muted); font-weight:700; }
.tone-btn:active { transform:scale(.95); }
.tone-btn.flash { background:#FFE2B3; }
.tip { background:#EEF6FF; border-radius:14px; padding:12px 14px; line-height:1.7; font-size:1rem; margin-top:12px; cursor:pointer; }
.tip b { color:var(--blue-d); }
/* 拼读 */
.blend { display:flex; align-items:center; justify-content:center; gap:10px; margin:16px 0 6px; flex-wrap:wrap; }
.tile { min-width:74px; height:84px; padding:0 12px; border-radius:18px; display:flex; align-items:center; justify-content:center;
        font-family:var(--py); font-size:2.4rem; font-weight:700; cursor:pointer; transition:transform .45s cubic-bezier(.5,0,.3,1.2); }
.tile.ini { background:#E3EEFF; color:#2F73DD; border:3px solid #9CC2FF; }
.tile.med { background:#E9F9F0; color:#2A8A5F; border:3px solid #9EE0BD; }
.tile.fin { background:#FFEFE0; color:#D86A00; border:3px solid #FFC58C; }
.plus { font-size:1.8rem; color:var(--muted); font-weight:800; }
.result { text-align:center; font-family:var(--py); font-size:3.4rem; font-weight:700; min-height:4.6rem; color:var(--pur-d); }
.result.pop { animation:pop .5s; }
/* 测验 */
.q-title { text-align:center; font-weight:800; font-size:1.18rem; }
.opt-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
.opt-grid.c1 { grid-template-columns:1fr; } .opt-grid.c4 { grid-template-columns:repeat(4,1fr); }
.opt { background:#fff; border:3px solid #E6E2F8; border-radius:18px; text-align:center; cursor:pointer; padding:14px 4px;
       font-family:var(--py); font-size:2.2rem; font-weight:700; box-shadow:0 4px 0 rgba(0,0,0,.04); }
.opt.emo { font-size:3rem; font-family:inherit; } .opt.small { font-size:1.6rem; }
.opt:active { transform:scale(.97); }
.opt.right { background:#E4F7EC; border-color:var(--green); animation:pop .35s; }
.opt.wrong { background:#FFECEC; border-color:var(--red); animation:shake .4s; }
@keyframes pop { 50% { transform:scale(1.1); } }
@keyframes shake { 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
.pbar { height:12px; background:#E6E2F8; border-radius:999px; overflow:hidden; margin-bottom:12px; }
.pbar > i { display:block; height:100%; background:linear-gradient(90deg,#7B61FF,#A48BFF); border-radius:999px; transition:width .4s; }
.word-py { text-align:center; font-family:var(--py); font-size:2.8rem; font-weight:700; color:var(--pur-d); margin:10px 0; }
/* 游戏 */
.holes { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px; }
.hole { height:120px; border-radius:50% 50% 24px 24px; background:linear-gradient(#8B5E3C,#6B4428); position:relative; overflow:hidden; cursor:pointer; }
.mole { position:absolute; left:50%; bottom:-6px; transform:translateX(-50%) translateY(100%); width:96px; height:104px; border-radius:48px 48px 18px 18px;
        background:#B98A5E; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:transform .35s cubic-bezier(.3,1.4,.5,1); }
.mole.up { transform:translateX(-50%) translateY(0); }
.mole .face { font-size:1.4rem; } .mole .py { font-family:var(--py); font-size:1.7rem; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4); }
.mole.bonk { animation:bonk .4s forwards; } @keyframes bonk { to { transform:translateX(-50%) translateY(100%) scale(.8); } }
.mole.no { animation:shake .4s; }
.train { display:flex; align-items:flex-end; justify-content:center; gap:6px; margin:16px 0; min-height:96px; transition:transform 1.2s ease-in; }
.train.go { transform:translateX(120vw); }
.car { min-width:76px; height:70px; border-radius:14px 14px 8px 8px; display:flex; align-items:center; justify-content:center; font-family:var(--py);
       font-size:2rem; font-weight:800; color:#fff; position:relative; padding:0 10px; }
.car::after { content:'● ●'; position:absolute; bottom:-16px; left:0; right:0; text-align:center; color:#444; font-size:1rem; letter-spacing:14px; }
.car.eng { background:#FF6B6B; border-radius:24px 14px 8px 8px; } .car.c1 { background:#4D96FF; } .car.c2 { background:#3FB27F; }
.car.empty { background:#E6E2F8; color:#B9B3D9; }
.celebrate { text-align:center; padding:30px 10px; }
.celebrate .big { font-size:4.4rem; animation:bounce 1s infinite alternate; }
@keyframes bounce { to { transform:translateY(-12px); } }
.celebrate h2 { margin:12px 0 6px; } .celebrate p { color:var(--muted); margin-bottom:20px; line-height:1.6; }
.coin-fly { position:fixed; width:48px; height:48px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#FFE566,#F5A623 55%,#B45309);
  box-shadow:0 0 0 3px #F5A623,0 6px 18px rgba(245,166,35,.6); pointer-events:none; z-index:250; display:flex; align-items:center; justify-content:center;
  animation:coinfly .85s cubic-bezier(.4,0,.2,1) forwards; }
.coin-fly::after { content:'★'; font-size:22px; color:#92400E; font-weight:900; }
@keyframes coinfly { 0%{transform:translate(0,0) scale(1.3) rotate(-15deg);opacity:1}
  40%{transform:translate(calc(var(--tx)*.4),calc(var(--ty)*.3)) scale(1.6) rotate(25deg);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(.3) rotate(360deg);opacity:0} }
.muted { color:var(--muted); font-size:.88rem; line-height:1.6; }
.toast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:#2B2A44; color:#fff; padding:12px 24px;
         border-radius:999px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .3s; z-index:300; max-width:90vw; text-align:center; }
.toast.show { opacity:.94; }
.parent-link { text-align:center; margin-top:18px; }
.parent-link button { background:none; border:none; color:#ADA8C8; font-size:.9rem; cursor:pointer; font-family:inherit; }
.seg { display:flex; gap:8px; margin-top:8px; } .seg button { flex:1; padding:10px; border-radius:12px; border:2px solid #E6E2F8; background:#fff;
       font-weight:800; font-family:inherit; font-size:.95rem; cursor:pointer; color:var(--ink); }
.seg button.on { border-color:var(--pur); background:#ECE8FF; color:var(--pur-d); }
.plan-row { display:flex; gap:10px; padding:8px 0; border-bottom:1px dashed #E6E2F8; font-size:.92rem; line-height:1.5; }
.plan-row b { min-width:92px; }
</style>
</head>

const INITIALS = ['zh', 'ch', 'sh', 'b', 'p', 'm', 'f', 'd', 't', 'n', 'l', 'g', 'k', 'h', 'j', 'q', 'x', 'r', 'z', 'c', 's', 'y', 'w'];
function split(base) {
  const s = sp(base); let ini = '';
  for (const c of INITIALS) if (s.startsWith(c)) { ini = c; break; }
  let fin = s.slice(ini.length);
  if ('jqx'.includes(ini) && ini && fin.startsWith('u')) fin = 'ü' + fin.slice(1);
  const parts = [{ t: ini, cls: 'ini' }];
  if (['ia', 'ua', 'uo'].includes(fin)) parts.push({ t: fin[0], cls: 'med' }, { t: fin.slice(1), cls: 'fin' });
  else parts.push({ t: fin, cls: 'fin' });
  return parts.filter(p => p.t);
}
function partKey(t) { return LMAP[t] ? nameKey(t) : null; }

// q = { title, audio:[keys], opts:[{html, ok, cls}], cols, onAnswer(ok) }
function runQuiz(qs, done, label) {
  let i = 0;
  const step = () => {
    if (i >= qs.length) return done();
    const q = qs[i]; let lock = false, first = true;
    stage().innerHTML = `<div class="pbar"><i style="width:${i / qs.length * 100}%"></i></div>
      <div class="card"><div class="q-title">${q.title || '听一听，点一点 👇'}</div>
      ${q.prompt || ''}${q.audio ? '<button class="speaker" id="spk">🔊</button>' : ''}
      <div class="opt-grid ${q.cols ? 'c' + q.cols : ''}">${q.opts.map((o, k) => `<div class="opt ${o.cls || ''}" data-k="${k}">${o.html}</div>`).join('')}</div></div>`;
    if (q.audio) { $('#spk').onclick = () => play(q.audio); later(() => play(q.audio), 300); }
    document.querySelectorAll('.opt').forEach(el => el.onclick = () => {
      if (lock) return; const o = q.opts[+el.dataset.k];
      if (o.ok) {
        lock = true; el.classList.add('right'); sfx(true);
        if (q.onAnswer) q.onAnswer(first);
        play(q.after || q.audio || []);
        later(() => { i++; step(); }, 1150);
      } else {
        el.classList.add('wrong'); sfx(false); first = false;
        setTimeout(() => el.classList.remove('wrong'), 450);
        if (q.audio) later(() => play(q.audio), 350);
      }
    });
  };
  step();
}
function qLetter(id, pool) {
  const same = pool.filter(x => x !== id && LMAP[x] && (LMAP[x].t === LMAP[id].t || LMAP[id].t === 'w' && LMAP[x].t === 'w'));
  let ds = sample(same, 3);
  if (ds.length < 3) ds = ds.concat(sample(D.letters.map(l => l.id).filter(x => LMAP[x].t === LMAP[id].t), 3 - ds.length, [id, ...ds]));
  if (ds.length < 3) ds = ds.concat(sample(D.letters.map(l => l.id), 3 - ds.length, [id, ...ds]));
  return { title: '听一听，是哪个拼音？', audio: [nameKey(id)],
    opts: shuffle([id, ...ds]).map(x => ({ html: disp(x), ok: x === id })) };
}
function qSyl(b, t, pool) {
  const ans = toneMark(sp(b), t);
  const cand = new Set();
  sample(pool.filter(x => x !== b), 6).forEach(x => cand.add(toneMark(sp(x), t)));
  [1, 2, 3, 4].filter(x => x !== t).forEach(x => cand.add(toneMark(sp(b), x)));
  cand.delete(ans);
  const ds = shuffle([...cand]).slice(0, 3);
  return { title: '听一听，是哪个音节？', audio: [SK(b, t)], opts: shuffle([ans, ...ds]).map(x => ({ html: disp(x), ok: x === ans, cls: 'small' })) };
}
function qTone(b, t, spell) {
  const s = spell || sp(b);
  return { title: '听一听，是第几声？', audio: [SK(b, t)], cols: 2,
    opts: [1, 2, 3, 4].map(x => ({ html: disp(toneMark(s, x)) + `<div style="font-size:.8rem;color:#7A7896;font-family:-apple-system,sans-serif">${'一二三四'[x - 1]}声</div>`, ok: x === t })) };
}

function lessonLetters(L, done) {
  const items = [...L.letters, ...(L.whole || [])];
  let k = 0;
  const step = () => {
    if (k >= items.length) {
      const old = learnedLetters().filter(x => !items.includes(x));
      const pool = [...new Set([...old, ...items])];
      const ids = shuffle(items.concat(items)).slice(0, 6).concat(sample(old, items.length > 2 ? 1 : 2));
      return runQuiz(shuffle(ids).map(id => qLetter(id, pool)), done);
    }
    const id = items[k];
    letterCard(id, k, items.length, () => { k++; step(); });
  };
  step();

  step();
}
function pickSpread(arr, n) { if (arr.length <= n) return arr.slice(); const out = []; for (let i = 0; i < n; i++) out.push(arr[Math.floor(i * arr.length / n)]); return out; }
function lessonBlend(L, done) {
  ruleCard(L, () => blendSeries(pickSpread(L.bases, 6), () => {
    const pool = L.bases, qs = [];
    for (let j = 0; j < 6; j++) { const b = pick(pool), t = 1 + Math.floor(Math.random() * 4); qs.push(j % 2 ? qTone(b, t) : qSyl(b, t, pool)); }
    runQuiz(qs, done);
  }));
}
function lessonPairs(L, done) {
  ruleCard(L, () => blendSeries(pickSpread(L.bases, 4), () => {
    const qs = shuffle(L.pairs.concat(L.pairs)).slice(0, 8).map(pr => {
      const tgt = pick(pr);
      return { title: '听一听，是哪一个？', audio: [SK(tgt, 1)], cols: 2,
        opts: shuffle(pr).map(x => ({ html: disp(toneMark(sp(x), 1)), ok: x === tgt })) };
    });
    runQuiz(qs, done);
  }));
}
// —— 整体认读 ——
function lessonWhole(L, done) {
  stage().innerHTML = `<div class="card"><div class="q-title">🧩 16 个整体认读音节</div>
    <div class="tip" id="wt">整体认读音节<b>不用拼，直接读</b>！点一点听一听 🔊</div>
    <div class="opt-grid c4" style="margin-top:12px">${L.whole.map(id => `<div class="opt small" data-id="${id}" style="font-size:1.25rem;padding:12px 2px">${LMAP[id].e}<br>${disp(id)}</div>`).join('')}</div>
  </div><button class="btn" id="nx">开始挑战 ➡️</button>`;
  $('#wt').onclick = () => play('x_whole');
  document.querySelectorAll('.opt').forEach(o => o.onclick = () => play(nameKey(o.dataset.id)));
  later(() => play('x_whole'), 350);
  $('#nx').onclick = () => runQuiz(sample(L.whole, 8).map(id => qLetter(id, L.whole)), done);
}
// —— 直呼 ——
function lessonWords(L, done) {
  const ws = shuffle(D.words.map((w, i) => i)).slice(0, 10);
  stage().innerHTML = `<div class="card"><div class="q-title">📖 直呼小达人</div>
    <div class="tip">不用一个一个拼，<b>看到拼音直接读出来</b>，再找到对应的图片！</div></div><button class="btn" id="nx">开始 ➡️</button>`;
  $('#nx').onclick = () => runQuiz(ws.map(i => {
    const ds = sample(D.words.map((w, j) => j), 3, [i]);
    return { title: '读一读，是哪个图片？', prompt: `<div class="word-py">${disp(D.words[i][1])}</div>`, after: ['w_' + String(i).padStart(2, '0')], cols: 2,
      opts: shuffle([i, ...ds]).map(j => ({ html: D.words[j][2], ok: j === i, cls: 'emo' })) };
  }), done);
}

/* ============ 游戏：声调打地鼠 ============ */
function gameBases() {
  const b = learnedBases(); const base = ['a', 'o', 'e', 'yi', 'wu', 'yu'];
  return b.length ? b.concat(base) : base;
}
function gameTone() {
  navTok++;
  setTitle('🔨 声调打地鼠'); setBack('⬅️ 星球', home); playTok++;
  const pool = gameBases(); let round = 0, score = 0;
  const R = 10;
  const next = () => {
    if (round >= R) return gameEnd('tone', score, R);
    const b = pick(pool), t = 1 + Math.floor(Math.random() * 4), order = shuffle([1, 2, 3, 4]);
    let lock = false, miss = false;
    stage().innerHTML = `<div class="pbar"><i style="width:${round / R * 100}%"></i></div>
      <div class="card"><div class="q-title">听声调，敲对的地鼠！🔨 <span class="muted">得分 ${score}</span></div>
      <button class="speaker" id="spk">🔊</button>
      <div class="holes">${order.map(x => `<div class="hole" data-t="${x}"><div class="mole"><div class="face">🐹</div><div class="py">${disp(toneMark(sp(b), x))}</div></div></div>`).join('')}</div></div>`;
    $('#spk').onclick = () => play(SK(b, t));
    setTimeout(() => document.querySelectorAll('.mole').forEach((m, k) => setTimeout(() => m.classList.add('up'), k * 90)), 50);
    later(() => play(SK(b, t)), 400);
    document.querySelectorAll('.hole').forEach(h => h.onclick = () => {
      if (lock) return; const m = h.querySelector('.mole');
      if (+h.dataset.t === t) { lock = true; if (!miss) score++; sfx(true); m.classList.add('bonk'); round++; later(next, 900); }
      else { miss = true; sfx(false); m.classList.remove('no'); void m.offsetWidth; m.classList.add('no'); later(() => play(SK(b, t)), 350); }
    });
  };
  next();
}
/* ============ 游戏：拼读小火车 ============ */
function gameTrain() {
  navTok++;
  setTitle('🚂 拼读小火车'); setBack('⬅️ 星球', home); playTok++;
  const pool = learnedBases().filter(b => split(b).length === 2);
  const src = pool.length >= 4 ? pool : D.lessons[10].bases;
  let round = 0, score = 0; const R = 8;
  const allIni = [...new Set(src.map(b => split(b)[0].t))], allFin = [...new Set(src.map(b => split(b)[1].t))];
  const next = () => {
    if (round >= R) return gameEnd('train', score, R);
    const b = pick(src), t = 1 + Math.floor(Math.random() * 4), [pi, pf] = split(b);
    let stepN = 0, miss = false, finished = false;
    const cars = () => `<div class="train" id="train"><div class="car eng">🚂</div>
      <div class="car c1 ${stepN > 0 ? '' : 'empty'}">${stepN > 0 ? disp(pi.t) : '?'}</div>
      <div class="car c2 ${stepN > 1 ? '' : 'empty'}">${stepN > 1 ? disp(pf.t) : '?'}</div>
      <div class="car c1 ${stepN > 2 ? '' : 'empty'}" style="background:${stepN > 2 ? '#F5A623' : ''}">${stepN > 2 ? disp(toneMark(sp(b), t)) : '声调'}</div></div>`;
    const render = () => {
      let opts, title, ok;
      if (stepN === 0) { opts = shuffle([pi.t, ...sample(allIni.length > 2 ? allIni : INITIALS.slice(3, 15), 2, [pi.t])]); title = '第一节车厢：选声母'; ok = pi.t; }
      else if (stepN === 1) { opts = shuffle([pf.t, ...sample(allFin.length > 2 ? allFin : ['a', 'o', 'e', 'i', 'u'], 2, [pf.t])]); title = '第二节车厢：选韵母'; ok = pf.t; }
      else { opts = [1, 2, 3, 4].map(x => toneMark(sp(b), x)); title = '最后一节：选声调'; ok = toneMark(sp(b), t); }
      stage().innerHTML = `<div class="pbar"><i style="width:${round / R * 100}%"></i></div>
        <div class="card"><div class="q-title">${title} <span class="muted">得分 ${score}</span></div>${cars()}
        <button class="speaker" id="spk">🔊</button>
        <div class="opt-grid ${stepN === 2 ? 'c2' : ''}" style="grid-template-columns:repeat(${opts.length === 3 ? 3 : 2},1fr)">${opts.map(o => `<div class="opt small" data-o="${o}">${disp(o)}</div>`).join('')}</div></div>`;
      $('#spk').onclick = () => play(SK(b, t));
      if (stepN === 0) later(() => play(SK(b, t)), 400);
      document.querySelectorAll('.opt').forEach(el => el.onclick = () => {
        if (finished) return;
        if (el.dataset.o === ok) {
          sfx(true); stepN++;
          if (stepN === 3) {
            finished = true; el.classList.add('right');
            document.querySelectorAll('.opt').forEach(o => o.style.pointerEvents = 'none');
            if (!miss) score++; round++;
            stage().querySelector('.train').outerHTML = cars();
            play([...(partKey(pi.t) ? [partKey(pi.t), '_'] : []), ...(partKey(pf.t) ? [partKey(pf.t), '_'] : []), SK(b, t)]);
            later(() => { const tr = $('#train'); if (tr) tr.classList.add('go'); }, 1700);
            later(next, 3000);
          } else render();
        } else { miss = true; sfx(false); el.classList.add('wrong'); setTimeout(() => el.classList.remove('wrong'), 450); play(SK(b, t)); }
      });
    };
    render();
  };
  next();
}
function gameEnd(id, score, total) {
  const rec = todayRec(); rec.games = rec.games || {};
  let msg = '';
  if (!rec.games[id]) { rec.games[id] = true; save(); addStar(); msg = '得到一颗星星！'; }
  confetti();
  stage().innerHTML = `<div class="card celebrate"><div class="big">${score >= total - 1 ? '🏆' : '💪'}</div>
    <h2>答对 ${score} / ${total}！${msg}</h2><p>${score >= total - 1 ? '耳朵真灵！' : '多听多练，越来越厉害！'}</p>
    <button class="btn" id="b1">再玩一次 🔁</button><button class="btn ghost" id="b2">回到星球</button></div>`;
  $('#b1').onclick = id === 'tone' ? gameTone : gameTrain; $('#b2').onclick = home;
}

/* ============ 家长面板 ============ */
function parentPanel() {
  navTok++;
  load(); setTitle('⚙️ 家长'); setBack('⬅️ 星球', home);
  const st = S.settings, done = Object.keys(S.done).length;
  const weak = Object.keys(S.srs).filter(k => S.srs[k].wrong >= 2).map(k => disp(sp(k.slice(2))));
  stage().innerHTML = `<div class="card"><div style="font-weight:900;font-size:1.1rem;margin-bottom:6px">📋 学习方案（统编版一年级上册顺序）</div>
    <div class="plan-row"><b>🌱 第1站</b><span>单韵母 ɑ o e i u ü + 四声调 + y w（8 关）</span></div>
    <div class="plan-row"><b>🚂 第2站</b><span>23 个声母 + 两拼/三拼 + 平翘舌听辨（13 关）</span></div>
    <div class="plan-row"><b>🌈 第3站</b><span>复韵母 ɑi ei ui ɑo ou iu ie üe er + 标调规则（4 关）</span></div>
    <div class="plan-row"><b>🔔 第4站</b><span>鼻韵母 ɑn en in un ün ɑnɡ enɡ inɡ onɡ + 前后鼻听辨（5 关）</span></div>
    <div class="plan-row" style="border:none"><b>🏆 第5站</b><span>16 个整体认读音节 + 直呼词语（2 关）</span></div>
    <p class="muted" style="margin-top:8px">建议节奏：每天 10–15 分钟、每天 1 关，约 7–8 周学完全部 32 关；之后每天只做"复习 + 游戏"保持手感，入学前达到<b>看到音节能直接读出（直呼）</b>的目标。</p></div>
    <div class="card"><div style="font-weight:900">📊 进度</div>
      <p class="muted">已完成 ${done} / ${D.lessons.length} 关 · 已学拼音 ${learnedLetters().length} 个 · 拼读音节 ${learnedBases().length} 个 · 今日待复习 ${dueList().length} 个</p>
      ${weak.length ? `<p class="muted">需要多练：${weak.join('、')}</p>` : ''}</div>
    <div class="card"><div style="font-weight:900">每天学几关</div>
      <div class="seg" id="perDay">${[1, 2].map(n => `<button data-n="${n}" class="${st.perDay === n ? 'on' : ''}">${n} 关</button>`).join('')}</div>
      <div style="font-weight:900;margin-top:16px">解锁全部关卡</div>
      <p class="muted">孩子已在别处学过部分拼音时打开，可直接跳到任意关卡。</p>
      <div class="seg" id="unl"><button data-v="0" class="${st.unlockAll ? '' : 'on'}">按顺序闯关</button><button data-v="1" class="${st.unlockAll ? 'on' : ''}">全部解锁</button></div>
      <button class="btn ghost" id="reset" style="margin-top:18px">清空学习进度</button></div>`;
  document.querySelectorAll('#perDay button').forEach(b => b.onclick = () => { S.settings.perDay = +b.dataset.n; save(); parentPanel(); toast('已保存'); });
  document.querySelectorAll('#unl button').forEach(b => b.onclick = () => { S.settings.unlockAll = b.dataset.v === '1'; save(); parentPanel(); toast('已保存'); });
  $('#reset').onclick = () => { if (confirm('确定清空拼音星球的全部学习进度吗？')) { localStorage.removeItem(KEY); S = null; home(); toast('已清空'); } };
}

home();
</script>
